<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect x="20" y="20" width="600" height="360" rx="28" fill="#eef0fb"/>

  <!-- Horloge murale -->
  <g stroke="#1b1b1b" stroke-width="3" stroke-linecap="round">
    <circle cx="560" cy="80" r="26" fill="#ffffff"/>
    <line x1="560" y1="80" x2="560" y2="64"/>
    <line x1="560" y1="80" x2="572" y2="86"/>
  </g>

  <!-- Écran : le formulaire en cours de rédaction -->
  <g stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="96" y="70" width="290" height="196" rx="10" fill="#0f1d96"/>
    <rect x="108" y="82" width="266" height="172" rx="4" fill="#ffffff"/>
    <path d="M222 266 L260 266 L266 296 L216 296 Z" fill="#8a93a8"/>
    <rect x="190" y="296" width="102" height="10" rx="4" fill="#bec3c3"/>
  </g>
  <!-- En-tête et lignes du formulaire -->
  <rect x="108" y="82" width="266" height="22" fill="#e5f4e9"/>
  <rect x="120" y="89" width="110" height="8" rx="4" fill="#009628"/>
  <g fill="#0f1d96">
    <rect x="122" y="118" width="14" height="8" rx="4"/>
    <rect x="122" y="152" width="14" height="8" rx="4"/>
    <rect x="122" y="200" width="14" height="8" rx="4"/>
  </g>
  <g fill="#bec3c3">
    <rect x="144" y="118" width="150" height="8" rx="4"/>
    <rect x="144" y="132" width="200" height="6" rx="3" fill="#dde0e0"/>
    <rect x="144" y="152" width="170" height="8" rx="4"/>
    <rect x="144" y="200" width="130" height="8" rx="4"/>
    <rect x="144" y="214" width="190" height="6" rx="3" fill="#dde0e0"/>
    <rect x="144" y="226" width="160" height="6" rx="3" fill="#dde0e0"/>
  </g>
  <!-- Champ en cours : contour vert et curseur -->
  <rect x="140" y="164" width="218" height="26" rx="4" fill="#ffffff" stroke="#009628" stroke-width="2.5"/>
  <rect x="148" y="174" width="96" height="6" rx="3" fill="#0f1d96"/>
  <line x1="250" y1="170" x2="250" y2="184" stroke="#0f1d96" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Médecin, de trois quarts, stylo en main -->
  <g stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M410 340 C412 260 440 232 492 232 C544 232 572 260 574 340 Z" fill="#ffffff"/>
    <path d="M476 234 L492 266 L508 234 Z" fill="#0f1d96"/>
    <rect x="481" y="208" width="22" height="28" fill="#b9805c"/>
    <ellipse cx="492" cy="180" rx="34" ry="38" fill="#c98f6b"/>
    <path d="M458 174 C454 138 474 128 494 128 C516 128 530 140 527 174 C520 154 506 149 492 150 C476 150 464 158 458 174 Z" fill="#2b2420"/>
    <circle cx="478" cy="182" r="9" fill="none"/>
    <circle cx="504" cy="182" r="9" fill="none"/>
    <line x1="487" y1="182" x2="495" y2="182"/>
    <path d="M484 200 C490 203 496 203 502 200" fill="none"/>
  </g>
  <g fill="#1b1b1b">
    <circle cx="476" cy="182" r="2.5"/>
    <circle cx="502" cy="182" r="2.5"/>
  </g>

  <!-- Bureau, clavier, tasse -->
  <g stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="60" y="306" width="520" height="22" rx="8" fill="#d5d9d9"/>
    <rect x="80" y="328" width="480" height="52" fill="#bec3c3"/>
    <rect x="168" y="290" width="150" height="16" rx="4" fill="#ffffff"/>
    <rect x="356" y="272" width="30" height="34" rx="4" fill="#009628"/>
    <path d="M386 280 C398 280 398 298 386 298" fill="none"/>
    <!-- Main et stylo sur une note -->
    <rect x="420" y="288" width="64" height="18" rx="2" fill="#ffffff"/>
    <line x1="440" y1="296" x2="476" y2="268" stroke="#0f1d96" stroke-width="5"/>
    <ellipse cx="452" cy="290" rx="12" ry="10" fill="#c98f6b"/>
  </g>
</svg>
