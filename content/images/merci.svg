    <rect x="70" y="120" width="120" height="156" rx="8" fill="#ffffff"/>
    <rect x="70" y="120" width="120" height="26" rx="8" fill="#0f1d96"/>
    <circle cx="176" cy="262" r="26" fill="#009628"/>
  </g>
  <g fill="#bec3c3">
    <rect x="86" y="164" width="88" height="7" rx="3.5"/>
    <rect x="86" y="182" width="72" height="7" rx="3.5"/>
    <rect x="86" y="200" width="80" height="7" rx="3.5"/>
    <rect x="86" y="218" width="54" height="7" rx="3.5"/>
  </g>
  <path d="M163 262 L172 271 L189 253" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- À droite : chronomètre, une décision plus rapide -->
