<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Fond -->
  <rect x="20" y="20" width="600" height="360" rx="28" fill="#eef0fb"/>

  <!-- À gauche : rapport complet, validé -->
