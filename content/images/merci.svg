  </g>
  <circle cx="510" cy="180" r="6" fill="#009628" stroke="#1b1b1b" stroke-width="2"/>
  <g stroke="#009628" stroke-width="5" stroke-linecap="round">
    <line x1="580" y1="150" x2="598" y2="150"/>
    <line x1="582" y1="176" x2="604" y2="176"/>
    <line x1="580" y1="202" x2="598" y2="202"/>
  </g>

  <!-- Médecin qui salue -->
  <g stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bras levé -->
    <path d="M378 262 C396 236 404 206 400 178" fill="none" stroke-width="22"/>
    <path d="M378 262 C396 236 404 206 400 178" fill="none" stroke="#ffffff" stroke-width="16"/>
    <ellipse cx="400" cy="166" rx="14" ry="16" fill="#c98f6b"/>
    <!-- Buste -->
    <path d="M232 380 C234 296 264 266 320 266 C376 266 406 296 408 380 Z" fill="#ffffff"/>
    <path d="M302 268 L320 304 L338 268 Z" fill="#0f1d96"/>
    <path d="M302 268 L292 346 M338 268 L348 346" fill="none"/>
    <rect x="309" y="240" width="22" height="30" fill="#b9805c"/>
    <!-- Visage souriant -->
    <ellipse cx="320" cy="212" rx="36" ry="40" fill="#c98f6b"/>
    <path d="M284 206 C280 168 300 158 322 158 C346 158 360 172 357 206 C350 186 336 181 320 182 C303 182 291 190 284 206 Z" fill="#2b2420"/>
    <circle cx="306" cy="214" r="10" fill="none"/>
    <circle cx="334" cy="214" r="10" fill="none"/>
    <line x1="316" y1="214" x2="324" y2="214"/>
    <path d="M305 232 C314 244 326 244 335 232" fill="none"/>
    <!-- Stéthoscope -->
    <path d="M300 270 C290 302 300 328 320 330 C340 328 350 302 340 270" fill="none" stroke="#0f1d96" stroke-width="4"/>
    <circle cx="320" cy="334" r="7" fill="#bec3c3"/>
  </g>
  <g fill="#1b1b1b">
    <circle cx="306" cy="214" r="2.5"/>
    <circle cx="334" cy="214" r="2.5"/>
  </g>

  <!-- Cœur -->
  <path d="M320 112 C320 100 304 92 296 104 C290 114 300 126 320 140 C340 126 350 114 344 104 C336 92 320 100 320 112 Z" fill="#009628" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
</svg>
