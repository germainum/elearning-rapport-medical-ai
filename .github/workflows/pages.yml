# Construit le module et le publie sur GitHub Pages à chaque push sur main.
# Le paquet SCORM (zip) est aussi disponible en téléchargement dans l'onglet « Actions ».
name: Publier la version en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Valider le contenu et construire le paquet SCORM 1.2
        run: node scripts/build.js

      - name: Conserver le paquet SCORM
        uses: actions/upload-artifact@v4
        with:
          name: paquet-scorm-1.2
          path: dist/*.zip

      - uses: actions/configure-pages@v5

      - name: Préparer le site (contenu du paquet)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/package

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
